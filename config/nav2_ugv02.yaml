# 실물 UGV02 용 Nav2 설정 — 원본(nav2_burger_sim.yaml) + SLAM 모드(nav2_slam_mode.yaml) 위에 덮어쓴다.
# scr_bringup/launch/nav.launch.py 가 합쳐서 쓴다. 숫자는 처음이라 "안전하게 느리게"가 원칙 (2026-10-31 초안).
#
# 시뮬(my_nav2.yaml)에서 가져온 것: controller = MPPI (docs/decisions/001), 후진 허용
# 실물이라 바꾼 것: 로봇 모양 25×23 cm 사각형, 속도 상한 낮게, 출발·정지 부드럽게, 방이 좁으니 안전 여유 작게,
#                    라이다가 자기 몸(케이블 등)을 장애물로 보지 않게 가까운 점 무시

# 원칙 (Jasper 11-04): "조용하되 정확하게. 빠를 필요는 없다." — 집 안 로봇이지 물류 로봇이 아니다.
# 11-03 기어가기 모드 (브리지 v5 drive_mode pwm 전제, nav.launch 기본값): 속도를 측정한 바닥선 근처로.
#   직진 바닥선 0.05 m/s, 제자리 회전 바닥선 0.13 rad/s (docs/calibration/lowspeed-2026-11-03.md)
#   v4 (PID 모드) 로 돌릴 땐 이 저속에서 덜컹거림 → 예전 값: vx 0.20, wz 0.8 (git 10-31)

controller_server:
  ros__parameters:
    progress_checker:                    # "막혔나?" 판단. 11-04: 원본(20 s 에 10 cm)이 톡톡 밀기(1 cm 씩)와 충돌 →
                                         #   도착 직전 정밀 조정을 "막힘"으로 보고 중단·재시작 반복 (4구간 중 1개 110 s)
      plugin: "nav2_controller::PoseProgressChecker"   # 위치 + 방향 둘 다 봄 → 톡톡 회전도 진척으로 인정
      required_movement_radius: 0.03     # [m]   원본 0.1
      required_movement_angle: 0.2       # [rad] ≈ 11°
      movement_time_allowance: 20.0      # [s] 10 → 20: 기어가는 속도에서 제자리 180° 회전이 10초를 넘음 (0.3 rad/s ≈ 10 s)
    goal_checker:
      xy_goal_tolerance: 0.10            # [m]   11-04 0.15 → 0.08 → 0.10 (둘 다 맴돌기) → 톡톡 밀기 후 0.08 (4/4 성공, 실제 0.05~0.08,
                                         #       단 한 구간 69 s: MPPI 가 목표 앞에서 x·z 를 ± 로 깔짝 = 톡톡 52회) → 0.10.
                                         #       방 안 이동엔 10 cm 충분. 정밀이 필요한 도킹은 별도 접근 제어 (지도 좌표 아님)
      yaw_goal_tolerance: 0.25           # [rad] 14°
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"          # 스키드 스티어도 제어 모델은 차동 구동으로 근사
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000                   # Pi 5 계산량 확인 대상 (docs/decisions/001 재검증 기준)
      vx_max: 0.08                       # [m/s] 11-03 기어가기 (PWM 모드 0.08 = PWM 30, 덜컹 92). 10-31 PID 모드 땐 0.20
      vx_min: -0.05                      # 후진 허용 (시뮬에서 갇힘 방지로 확인, 10-24). 바닥선 0.05
      wz_max: 0.25                       # [rad/s] 11-04 0.4 → 0.25: 회전 = 바퀴 끌림 = 소음. 180° ≈ 13 s. 10-31 땐 0.8
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

velocity_smoother:                       # 출발·정지를 부드럽게 (Jasper 10-31: "엑셀 천천히, 브레이크 나눠 밟기")
  ros__parameters:
    max_velocity: [0.08, 0.0, 0.25]      # 11-03 기어가기 (MPPI 와 같은 상한), 11-04 회전 0.25
    min_velocity: [-0.05, 0.0, -0.25]
    max_accel: [0.15, 0.0, 0.6]          # [m/s², -, rad/s²] 0 → 0.08 m/s 약 0.5 s (출발 밀기는 브리지가 따로 함)
    max_decel: [-0.3, 0.0, -1.0]

behavior_server:                         # 복구 동작 (spin / backup) 도 기어가기 속도로
  ros__parameters:
    max_rotational_vel: 0.25             # [rad/s] 원본 1.0 → 빠른 제자리 회전은 소리·덜컹 (11-04 0.4 → 0.25)
    min_rotational_vel: 0.15             # 원본 0.4. 제자리 회전 바닥선 0.13 위
    rotational_acc_lim: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "voxel_layer", "whisker_layer", "inflation_layer"]   # 11-06 + whisker_layer
      whisker_layer:                     # 11-06 Whisker 2층: 부딪힘·끄덕임 자리 (scripts/whisker.py) — LiDAR 가 못 보는 것
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false  # 몸 밑이라고 지우지 않음
        observation_sources: whisker
        whisker:
          topic: /whisker/cloud
          data_type: "PointCloud2"
          marking: true
          clearing: false                  # LiDAR 도, 이 소스도 지우지 않음 (유리 너머 빔이 지우면 안 됨). 지우기 = /whisker/clear
          obstacle_max_range: 50.0         # 점 원점이 map (0,0) 이라 멀리 있어도 받게
          obstacle_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
      footprint: "[[0.13, 0.12], [0.13, -0.12], [-0.13, -0.12], [-0.13, 0.12]]"   # 252×230 mm (+약간), robot_radius 대신
      inflation_layer:
        inflation_radius: 0.25           # [m] 시뮬 0.5 → 방이 좁음 0.30 → 11-08 0.25 (Whisker 가 있으니 벽에 살짝 더. 몸 외접원 0.177)
        cost_scaling_factor: 4.0
      obstacle_layer:
        scan:
          obstacle_min_range: 0.11       # [m] 라이다 중심 11 cm 안 무시 = 몸 옆면(12 cm) 안쪽이라 진짜 장애물일 수 없는 거리.
          raytrace_min_range: 0.11       #   11-05 실측: 장착 상태 스캔 20장, 25 cm 안 점 0개 (10-28 의 +23°·10 cm 는 장착 전 책상 시험의
                                         #   케이블). 예전 0.18 은 검증 안 된 여유 → 옆 6 cm 안의 벽이 안 보였음. 팬틸트 달면 다시 잴 것
      voxel_layer:
        scan:
          obstacle_min_range: 0.11
          raytrace_min_range: 0.11

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "whisker_layer", "inflation_layer"]   # 11-06 + whisker_layer
      whisker_layer:                     # 11-06 Whisker 2층: 부딪힘·끄덕임 자리 (scripts/whisker.py) — LiDAR 가 못 보는 것
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false  # 몸 밑이라고 지우지 않음
        observation_sources: whisker
        whisker:
          topic: /whisker/cloud
          data_type: "PointCloud2"
          marking: true
          clearing: false                  # LiDAR 도, 이 소스도 지우지 않음 (유리 너머 빔이 지우면 안 됨). 지우기 = /whisker/clear
          obstacle_max_range: 50.0         # 점 원점이 map (0,0) 이라 멀리 있어도 받게
          obstacle_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
      footprint: "[[0.13, 0.12], [0.13, -0.12], [-0.13, -0.12], [-0.13, 0.12]]"
      inflation_layer:
        inflation_radius: 0.25           # 11-08 0.30 → 0.25 (지역과 같게)
        cost_scaling_factor: 4.0
      obstacle_layer:
        scan:
          obstacle_min_range: 0.11
          raytrace_min_range: 0.11
      voxel_layer:
        scan:
          obstacle_min_range: 0.11
          raytrace_min_range: 0.11

collision_monitor:                       # 마지막 안전망: 로봇 바로 앞 상자 안에 점이 생기면 정지/감속
  ros__parameters:
    polygons: ["PolygonSlow"]            # 11-08 Jasper: 정지 상자(PolygonStop)·접근 제한(FootprintApproach) 끔. Whisker + 힘 제한이
                                         #   "닿아도 안전하게"를 맡음. 좁은 곳(11시 입구, 좌우 여유 3 cm)에서 둘이 전진·후진·회전을
                                         #   다 막아 6 분 얼어붙음 (20:55 탐색). 너무 박고 다니면 그때 다시 켤 것
    scan:
      source_timeout: 0.5                # [s] 원본 0.2. 실물 라이다는 늘 0.22~0.23 s 늦게 도착(스캔 시작 시각 표시 + 전달)
                                         #     → 0.2 면 "못 믿을 라이다" → 정지 → 재출발 반복 = 덜컥거림 (10-31 첫 Nav2 목표: 7번)
                                         #     0.5 s × 0.2 m/s = 10 cm → 정지 띠(7 cm)·감속 띠(22 cm)·저속이면 안전
    PolygonStop:                         # 11-05: 방향 따라 다른 정지 상자 (velocity_polygon). 예전 "앞 띠 하나"는 후진까지 막아서
                                         #   가구 틈에 앞이 막히면 뒤로도 못 빠져나와 끝까지 갇힘 (11-05 23:04 탐색: 정지 64초, 해제 없음)
      type: "velocity_polygon"
      holonomic: false
      velocity_polygons: ["forward", "backward", "rotation"]   # 위에서부터 먼저 맞는 것
      forward:                           # 전진 중: 앞 1~7 cm 띠
        points: "[[0.20, 0.15], [0.20, -0.15], [0.14, -0.15], [0.14, 0.15]]"
        linear_min: 0.005
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
      backward:                          # 후진 중: 뒤 1~7 cm 띠 (앞이 막혀 있어도 뒤가 비면 빠져나감)
        points: "[[-0.14, 0.15], [-0.14, -0.15], [-0.20, -0.15], [-0.20, 0.15]]"
        linear_min: -1.0
        linear_max: -0.005
        theta_min: -2.0
        theta_max: 2.0
      rotation:                          # 제자리 회전: 모서리가 쓰는 원(반지름 17.7 cm) + 1 cm 안에 점 → 정지
        points: "[[0.19, 0.19], [0.19, -0.19], [-0.19, -0.19], [-0.19, 0.19]]"
        linear_min: -0.005
        linear_max: 0.005
        theta_min: -2.0
        theta_max: 2.0
    PolygonSlow:
      points: "[[0.35, 0.20], [0.35, -0.20], [0.14, -0.20], [0.14, 0.20]]"   # 앞 1~22 cm → 30% 로 감속
