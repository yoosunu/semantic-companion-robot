# 탐색·투어링 모드 (SLAM) — nav.launch.py 가 nav2_ugv02.yaml 위에 마지막으로 덮어씀.
# 원칙 (Jasper 11-05): "SLAM 의 목표는 부딪히지 않고 적당히 돌아다니며 지도를 그리는 것. 목표 지점에 정밀하게 가는 건 의미 없다."
#   → 도착 판정을 느슨하게, 도착 방향은 아예 안 봄. 충돌 회피(costmap·collision_monitor)와 막힘 판정(progress checker)은 그대로.
#   근거 (11-05 로그): 목표 근처에서 "위치 + 방향 동시에 맞추기"가 우리 로봇이 못 하는 아주 느린 회전(< 0.13 rad/s)을 요구 →
#   회전 명령 부호가 1초마다 뒤집히며 4분 헤맴 (가운데 목표 = 뒤돌아 서기 180°). 같은 지도·목표면 같은 곳에서 재현됨.
#   정밀이 필요한 일(순회 사진 위치, 도킹)은 지도 완성 후 순회 모드에서 따로 엄격하게.
controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.30            # [m] 0.10 → 30 cm 안이면 도착. LiDAR 는 몇 m 를 보니 지도엔 차이 없음
      yaw_goal_tolerance: 3.15           # [rad] > π = 어느 방향으로 서도 도착 (방향 맞추기 끔)
    FollowPath:
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]   # GoalAngleCritic 뺌
